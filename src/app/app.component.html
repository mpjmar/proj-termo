<app-control-temperature
  [temperature]="this.temperature"
  [umbral]="this.umbral"
  (tempOutput)="onCambioTempOutput($event)"
  (umbralOutput)="onCambioUmbral($event)"
></app-control-temperature>

<app-display-thermostate
  [temperature]="this.temperature"
  [umbral]="this.umbral"
></app-display-thermostate>
