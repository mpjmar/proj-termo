<div>
  <span class="title">Control de Temperatura</span>
</div>

<div class="controls">
  <button (click)="onClickDecTemp()">➖</button>
  <span> {{ temperature() }} ºC </span>
  <button (click)="onClickIncTemp()">➕</button>
</div>

<div>
  <span>Umbral alerta</span>
</div>

<div>
  <input
    id="umbralValue"
    type="text"
    [value]="umbral()"
    (input)="onInputUmbral($event)"
  />
</div>
